apiVersion: v1
kind: Namespace
metadata:
  name: castai-workload-resize-migrator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: castai-workload-resize-migrator
  namespace: castai-workload-resize-migrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: castai-workload-resize-migrator
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
    resourceNames: ["castai-workload-resize-migrator"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
    resourceNames: ["castai-workload-resize-migrator"]
  - apiGroups: ["live.cast.ai"]
    resources: ["migrations"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: castai-workload-resize-migrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: castai-workload-resize-migrator
subjects:
  - kind: ServiceAccount
    name: castai-workload-resize-migrator
    namespace: castai-workload-resize-migrator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: castai-workload-resize-migrator
  namespace: castai-workload-resize-migrator
data:
  placeholder: "leader-election-lock"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: castai-workload-resize-migrator
  namespace: castai-workload-resize-migrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: castai-workload-resize-migrator
  template:
    metadata:
      labels:
        app: castai-workload-resize-migrator
    spec:
      serviceAccountName: castai-workload-resize-migrator
      containers:
        - name: controller
          image: ttl.sh/castai-workload-resize-migrator:latest
          imagePullPolicy: Always
          env:
            - name: DRY_RUN
              value: "true"
            - name: PENDING_THRESHOLD
              value: "2m"
            - name: NODE_DELTA_THRESHOLD
              value: "0.15"
            - name: MIGRATION_TIMEOUT
              value: "10m"
            - name: MIGRATION_RETRY_LIMIT
              value: "3"
            - name: MIGRATION_ALERT_THRESHOLD
              value: "3"
            - name: CLM_NODE_TEMPLATE
              value: "clm-live-migration-template"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
