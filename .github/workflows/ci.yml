name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  version-drift:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check version consistency (source of truth is Chart.yaml appVersion)
        run: |
          set -eu
          APPVERSION=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' helm/Chart.yaml)
          if [ -z "$APPVERSION" ]; then
            echo "Chart.yaml appVersion not found"; exit 1
          fi
          echo "Chart appVersion: $APPVERSION"
          DRIFT=0
          # values.yaml must not hardcode an image tag (defaults to appVersion)
          if grep -qE '^\s*tag: "[0-9]' helm/values.yaml; then
            echo "DRIFT: helm/values.yaml hardcodes an image tag; leave it empty to default to appVersion"; DRIFT=1
          fi
          # No hardcoded image:tag references outside Chart.yaml
          for f in $(grep -rlE 'castai-workload-resize-migrator:[0-9]+\.[0-9]+' \
              --include='*.yaml' --include='*.yml' --include='*.md' . \
              | grep -v '^./helm/Chart.yaml'); do
            echo "DRIFT: hardcoded version reference in $f"; DRIFT=1
          done
          # The git tag (when pushing one) must match appVersion
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "refs/tags/v$APPVERSION" != "$GITHUB_REF" ]; then
            echo "DRIFT: git tag $GITHUB_REF does not match Chart.yaml appVersion v$APPVERSION"; DRIFT=1
          fi
          if [ "$DRIFT" = "1" ]; then exit 1; fi
          echo "No version drift."
  test:
    name: Build, vet, race tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: test -z "$(gofmt -l cmd pkg)"

      - name: Race tests
        run: go test ./... -race -timeout 600s

      - name: Benchmark smoke (safety scan)
        run: go test ./pkg/detector -run '^$' -bench . -benchtime 1x

  helm:
    name: Helm lint + template matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint chart
        run: helm lint helm/

      - name: Render defaults
        run: helm template helm/ > /dev/null

      - name: Render custom config
        run: |
          helm template helm/ \
            --set config.dryRun=false \
            --set config.leaderElection=false \
            --set config.migrationRetryLimit=0 \
            --set config.pendingThreshold=30s > /dev/null

  docker:
    name: Docker build, push to GHCR, trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load image for trivy (PR builds)
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: castai-workload-resize-migrator:ci
          cache-from: type=gha

      - name: Trivy scan (advisory)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ github.event_name == 'push' && format('ghcr.io/{0}:main', github.repository) || 'castai-workload-resize-migrator:ci' }}
          severity: CRITICAL,HIGH
          exit-code: "0"

  publish-chart:
    name: Publish Helm chart to GHCR (OCI)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: Login to GHCR
        run: |-
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
      - name: Package chart
        run: |
          helm package helm \
            --destination .chart \
            --app-version "${GITHUB_REF_NAME#v}" \
            --version "${GITHUB_REF_NAME#v}"
      - name: Push chart
        run: |
          helm push .chart/castai-workload-resize-migrator-*.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts
      - name: Verify push
        run: |
          helm show chart oci://ghcr.io/${{ github.repository_owner }}/charts/castai-workload-resize-migrator \
            --version "${GITHUB_REF_NAME#v}"
