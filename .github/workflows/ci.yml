name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, race tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: test -z "$(gofmt -l cmd pkg)"

      - name: Race tests
        run: go test ./... -race -timeout 600s

      - name: Benchmark smoke (safety scan)
        run: go test ./pkg/detector -run '^$' -bench . -benchtime 1x

  helm:
    name: Helm lint + template matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint chart
        run: helm lint helm/

      - name: Render defaults
        run: helm template helm/ > /dev/null

      - name: Render custom config
        run: |
          helm template helm/ \
            --set config.dryRun=false \
            --set config.leaderElection=false \
            --set config.migrationRetryLimit=0 \
            --set config.pendingThreshold=30s > /dev/null

  docker:
    name: Docker build + trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: castai-workload-resize-migrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (advisory)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: castai-workload-resize-migrator:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
