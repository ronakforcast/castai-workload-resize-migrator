# Default values for castai-workload-resize-migrator

# -- Controller image
image:
  repository: ghcr.io/ronakforcast/castai-workload-resize-migrator
  # tag defaults to the chart appVersion (single source of truth in
  # Chart.yaml). CI fails on any hardcoded drift, so do not set it here.
  tag: ""
  pullPolicy: IfNotPresent

# -- Number of controller replicas (leader election ensures only one is active)
replicaCount: 1

# -- Namespace to deploy the controller into
namespace: castai-workload-resize-migrator

# -- Controller configuration (env vars)
config:
  # -- If true, logs what migrations would be created but does not create CRDs
  dryRun: true

  # -- How long a Deferred resize must be pending before triggering migration
  pendingThreshold: "2m"

  # -- How often the fallback safety scan runs (NOT the primary trigger — migrations are event-driven)
  safetyScanInterval: "2m"

  # -- Delay after startup before the first fallback safety scan runs
  safetyScanStartupDelay: "10s"

  # -- How long a migration is considered active before expiring
  migrationTimeout: "10m"

  # -- How often completed/failed migrations are cleaned from in-memory tracking
  migrationCleanupInterval: "30s"

  # -- Max retries per failed migration
  migrationRetryLimit: 3
  # -- Circuit breaker: max migrations per pod per hour (0 disables)
  migrationRateLimitPerHour: 5
  # -- Max migrations in flight across all pods (0 disables)
  maxConcurrentMigrations: 3
  # -- How long a destination that exhausted the retry limit stays
  # excluded for that pod (0 disables)
  failedDestinationTTL: "1h"

  # -- Label selector a destination node must satisfy entirely (e.g.
  # topology.kubernetes.io/zone: ap-south-1b). Required for zonal PVCs
  # whose data cannot cross AZs; empty disables the filter.
  destinationNodeSelector: {}

  # -- Minimum delay before retrying a failed migration
  migrationRetryDelay: "30s"

  # -- Name of the CLM-enabled node template (informational)
  clmNodeTemplate: "clm-live-migration-template"

  # -- Comma-separated list of CAST AI node template names. When set, only
  # pods running on nodes provisioned from these templates are considered
  # for migration. Empty means all pods (no scoping).
  sourceNodeTemplates: ""

  # -- Enable leader election (recommended for HA)
  leaderElection: true

  # -- Name of the leader election lease (must match the leases resourceName in ClusterRole)
  leaderElectionLeaseName: "castai-workload-resize-migrator"

# -- Resource requests and limits for the controller pod. Sized for
# clusters up to ~3000 pods: requests guarantee a 500m CPU / 1Gi floor,
# limits allow GC and per-scan full-pod-list bursts.
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

# -- Node selector for the controller pod
nodeSelector: {}

# -- Tolerations for the controller pod
tolerations: []

# -- Affinity for the controller pod
affinity: {}

# -- Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
